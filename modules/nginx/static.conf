{% autoescape off %}# Generated by `manage.py sync_nginx`, changes are overwritten.
# {{ description }}
server {
    listen 80;
    listen [::]:80;
    server_name {{ server_name }};

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme/acme-challenge;
        default_type text/plain;
        try_files $uri @dome_acme_fanout;
    }

    location @dome_acme_fanout {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{ server_name }};

    ssl_certificate /var/lib/dome/certs/live/{{ server_name }}/fullchain.pem;
    ssl_certificate_key /var/lib/dome/certs/live/{{ server_name }}/key.pem;

{% if root %}
    root "{{ root }}";
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
{% else %}
    location / {
        return 404;
    }
{% endif %}
}
{% endautoescape %}
